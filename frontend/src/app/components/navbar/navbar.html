<header class="top-navbar">
  <div class="navbar-left">
    <div class="brand-logo">
      <span class="brand-name">TaxPal</span>
    </div>
  </div>

  <div class="navbar-right">
    <!-- Theme Toggle Button (Placed to the left of the user profile/name) -->
    <button type="button" class="theme-toggle-btn" (click)="toggleTheme()" [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'" [attr.aria-label]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <!-- Sun Icon for Dark Mode -->
      <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon sun-icon">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>

      <!-- Moon Icon for Light Mode -->
      <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon moon-icon">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="user-profile-section">
      <div class="user-avatar">
        <img *ngIf="currentUser?.avatar" [src]="currentUser?.avatar" alt="Avatar" class="avatar-img" />
        <span *ngIf="!currentUser?.avatar">{{ userInitial }}</span>
      </div>
      <div class="user-info">
        <span class="user-name">{{ currentUser?.name || 'User' }}</span>
        <span class="user-email">{{ currentUser?.email || 'user@example.com' }}</span>
      </div>
    </div>
  </div>
</header>
