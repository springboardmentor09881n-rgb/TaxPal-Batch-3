<div class="categories-container">

  <h2>Category Management</h2>

  <div
    *ngIf="message"
    class="message"
    [class.success]="messageType==='success'"
    [class.error]="messageType==='error'">
    {{ message }}
  </div>

  <div class="tabs">
    <button
      type="button"
      (click)="changeType('income')"
      [class.active]="selectedType==='income'">
      Income
    </button>

    <button
      type="button"
      (click)="changeType('expense')"
      [class.active]="selectedType==='expense'">
      Expense
    </button>
  </div>

  <div class="category-form">
    <input
      type="text"
      placeholder="Category Name"
      [(ngModel)]="form.name">

    <input
      type="text"
      placeholder="Description (Optional)"
      [(ngModel)]="form.description">

    <button type="button" (click)="saveCategory()">
      {{ editingId ? 'Update Category' : 'Add Category' }}
    </button>

    <button
      *ngIf="editingId"
      type="button"
      (click)="resetForm()">
      Cancel
    </button>
  </div>

  <div class="table-responsive">
    <table class="categories-table">
      <thead>
        <tr>
          <th class="col-name">Name</th>
          <th class="col-description">Description</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of filteredCategories">
          <td class="col-name">
            <strong>{{ category.name }}</strong>
          </td>
          <td class="col-description">
            {{ category.isDefault ? 'Default' : (category.description || 'User Custom Category') }}
          </td>
          <td class="col-actions">
            <div class="action-buttons" *ngIf="!category.isDefault; else defaultAction">
              <button
                type="button"
                class="btn-edit"
                (click)="editCategory(category)">
                Edit
              </button>
              <button
                type="button"
                class="btn-delete"
                (click)="deleteCategory(category._id!)">
                Delete
              </button>
            </div>
            <ng-template #defaultAction>
              <span class="default-badge">Default</span>
            </ng-template>
          </td>
        </tr>
        <tr *ngIf="filteredCategories.length===0">
          <td colspan="3" class="empty">
            No {{ selectedType }} categories available.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
