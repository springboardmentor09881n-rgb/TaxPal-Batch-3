<div class="chat-widget-container">
  
  <!-- Floating Button -->
  <button class="chat-fab" (click)="toggleChat()" *ngIf="!isOpen">
    💬
  </button>

  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen">
    
    <div class="chat-header">
      <h4>Expense Tracker Support</h4>
      <button class="close-btn" (click)="closeChat()">✕</button>
    </div>

    <div class="chat-body" #chatBody>
      <div *ngFor="let msg of messages" class="message-wrapper" [class.user]="msg.sender === 'user'">
        <div class="message-bubble">
          {{ msg.text }}
        </div>
      </div>
      
      <div class="suggested-questions" *ngIf="messages.length === 1">
        <button 
          *ngFor="let suggestion of suggestedQuestions" 
          class="suggestion-chip" 
          (click)="sendMessage(suggestion)">
          {{ suggestion }}
        </button>
      </div>
    </div>

    <div class="chat-footer">
      <input 
        type="text" 
        [(ngModel)]="userInput" 
        (keyup.enter)="sendMessage()" 
        placeholder="Type a question..." 
      />
      <button (click)="sendMessage()">Send</button>
    </div>

  </div>
</div>
